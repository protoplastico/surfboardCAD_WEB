<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDF曲線をBezier化</title>
<style>:root{color-scheme:dark}body{margin:0;background:#17181c;color:#f5f5f7;font:14px system-ui,sans-serif}main{display:grid;grid-template-columns:340px minmax(0,1fr);gap:24px;padding:16px}aside{display:grid;align-content:start;gap:10px;position:sticky;top:16px;align-self:start;z-index:3;min-width:0;background:#17181c}label{display:grid;gap:4px}input,select,button{box-sizing:border-box;width:100%;font:inherit;padding:7px;border:1px solid #4b4d55;border-radius:5px;background:#25272d;color:inherit}button{cursor:pointer}.stage{min-width:0;overflow:auto;min-height:80vh;padding-left:24px;background:#333}.stage svg{display:block;max-width:100%;height:auto;background:#fff;transform-origin:top left}.hint{color:#b8bac2;font-size:12px;line-height:1.5}.status{min-height:1.4em;color:#8ed0a4}.preview{border:1px solid #454851;border-radius:5px;padding:8px;max-height:180px;overflow:auto;font-size:12px}.preview div{padding:3px 0;border-bottom:1px solid #303238}.preview .export-target{color:#8ed0a4}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.accent{background:#176b45;border-color:#43b982}</style></head>
<body><main><aside><h1>PDF曲線をBezier化</h1><label>PDF<input id="pdf" type="file" accept="application/pdf,.pdf"></label><label>ページ番号<input id="page" type="number" min="1" value="1"></label><button id="render" disabled>ページを表示</button><label>取り込み対象<select id="kind"><option value="outline">アウトライン (.otl)</option><option value="profile">プロファイル (.pfl)</option></select></label><div class="row"><label>自動スケール長(cm)<input id="length" type="number" step="0.1" value="244"></label><label>倍率<input id="scale" type="number" step="0.001" value="1"></label></div><div class="row"><label>X補正(cm)<input id="offsetX" type="number" step="0.1" value="0"></label><label>Y補正(cm)<input id="offsetY" type="number" step="0.1" value="0"></label></div><div id="preview" class="preview">矩形選択すると、曲線ごとのCP数を表示します。</div><button id="export" class="accent" disabled>選択線をBezierとして書き出す</button><p class="hint">PDFを選択後、線を含む範囲を矩形ドラッグしてください。選択範囲の横幅を指定長へ自動スケールし、補正値を加えて出力します。</p><p id="status" class="status"></p></aside><section id="stage" class="stage"></section></main>
<script>
const $=id=>document.getElementById(id),file=$('pdf'),pageInput=$('page'),renderButton=$('render'),exportButton=$('export'),stage=$('stage'),status=$('status'),preview=$('preview');let sourceFile=null,svg=null,paths=[],pathElements=[],selection=null,dragging=false,start=null;
const selectMode=document.createElement('select');selectMode.innerHTML='<option value="curve">線一覧／曲線を選択</option><option value="rectangle">矩形で選択</option>';selectMode.value='curve';selectMode.title='PDF曲線の選択方法';renderButton.insertAdjacentElement('afterend',selectMode);
const zoomControl=document.createElement('input');zoomControl.type='range';zoomControl.min='0.5';zoomControl.max='3';zoomControl.step='0.1';zoomControl.value='1';zoomControl.title='PDF表示倍率';renderButton.insertAdjacentElement('afterend',zoomControl);const zoomLabel=document.createElement('span');zoomLabel.textContent='表示倍率 100%';renderButton.insertAdjacentElement('afterend',zoomLabel);
const lineSelect=document.createElement('select');lineSelect.innerHTML='<option value="">線一覧から選択</option>';lineSelect.title='表示線を一覧から選択';zoomControl.insertAdjacentElement('afterend',lineSelect);
function selectPathIndex(index){const p=paths[index];if(!p)return;const xs=p.map(q=>q.x),ys=p.map(q=>q.y);selection={x:Math.min(...xs),y:Math.min(...ys),w:Math.max(...xs)-Math.min(...xs),h:Math.max(...ys)-Math.min(...ys)};selectMode.value='curve';drawPaths();setTimeout(()=>{lineSelect.value=String(index)},0);setStatus(`線 ${index+1} を選択しました`)}
lineSelect.addEventListener('change',()=>{if(lineSelect.value!=='')selectPathIndex(Number(lineSelect.value))});
lineSelect.addEventListener('wheel',e=>{if(lineSelect.options.length<2)return;e.preventDefault();const direction=e.deltaY>0?1:-1;const current=Math.max(0,lineSelect.selectedIndex-1),next=(current+direction+lineSelect.options.length-1)%(lineSelect.options.length-1);lineSelect.selectedIndex=next+1;selectPathIndex(Number(lineSelect.value))},{passive:false});
lineSelect.addEventListener('keydown',e=>{if(e.key!=='ArrowDown'&&e.key!=='ArrowUp')return;e.preventDefault();if(lineSelect.options.length<2)return;const direction=e.key==='ArrowDown'?1:-1;const current=Math.max(0,lineSelect.selectedIndex-1),next=(current+direction+lineSelect.options.length-1)%(lineSelect.options.length-1);lineSelect.selectedIndex=next+1;selectPathIndex(Number(lineSelect.value))});
zoomControl.addEventListener('input',()=>{zoomLabel.textContent=`表示倍率 ${Math.round(Number(zoomControl.value)*100)}%`;if(svg){const vb=svg.viewBox.baseVal;svg.style.maxWidth='none';svg.style.width=`${vb.width*Number(zoomControl.value)}px`;svg.style.height=`${vb.height*Number(zoomControl.value)}px`}});
const overlayTransformObserver=new MutationObserver(()=>{if(!svg)return;lineSelect.innerHTML='<option value="">線一覧から選択</option>';pathElements.forEach((source,index)=>{const visible=source?.getAttribute('fill')==='none'||source?.hasAttribute('stroke');if(visible){const option=document.createElement('option');option.value=String(index);option.textContent=`線 ${index+1}（${paths[index]?.length||0}点）`;lineSelect.appendChild(option)}});svg.querySelectorAll('.import-path').forEach((el,index)=>{const source=pathElements[index],matrix=source?.getCTM?.(),visible=source?.getAttribute('fill')==='none'||source?.hasAttribute('stroke');el.style.pointerEvents=visible?'stroke':'none';if(source)source.style.pointerEvents=visible?'stroke':'none';if(matrix)el.setAttribute('transform',`matrix(${matrix.a} ${matrix.b} ${matrix.c} ${matrix.d} ${matrix.e} ${matrix.f})`)})});overlayTransformObserver.observe(stage,{childList:true,subtree:true});
const setStatus=s=>status.textContent=s;
function parsePath(d){const tokens=d.match(/[a-z]|[-+]?(?:\d*\.\d+|\d+\.?)(?:e[-+]?\d+)?/gi)||[],out=[];let i=0,x=0,y=0,cx=0,cy=0,cmd='';while(i<tokens.length){if(/[a-z]/i.test(tokens[i]))cmd=tokens[i++];const rel=cmd===cmd.toLowerCase(),take=n=>tokens.slice(i,i+=n).map(Number),next=(nx,ny)=>{x=rel?x+nx:nx;y=rel?y+ny:ny;out.push({x,y})};if(cmd.toLowerCase()==='m'||cmd.toLowerCase()==='l'){const v=take(2);next(v[0],v[1]);if(cmd.toLowerCase()==='m')cmd=rel?'l':'L'}else if(cmd.toLowerCase()==='h'){x=rel?x+Number(tokens[i++]):Number(tokens[i++]);out.push({x,y})}else if(cmd.toLowerCase()==='v'){y=rel?y+Number(tokens[i++]):Number(tokens[i++]);out.push({x,y})}else if(cmd.toLowerCase()==='c'){const v=take(6);next(v[4],v[5])}else if(cmd.toLowerCase()==='s'||cmd.toLowerCase()==='q'){const v=take(cmd.toLowerCase()==='s'?4:4);next(v[2],v[3])}else if(cmd.toLowerCase()==='z'){cmd='';}else{i++}}return out}
function selectedPaths(){return selection?paths.filter(p=>p.some(q=>inRect(q,selection))).sort((a,b)=>b.length-a.length):[]}
function drawPaths(){stage.querySelectorAll('.import-path,#selection,.cp-marker').forEach(n=>n.remove());const selected=selectedPaths(),target=selected[0];for(const p of paths){const el=document.createElementNS('http://www.w3.org/2000/svg','polyline');el.classList.add('import-path');el.setAttribute('points',p.map(q=>`${q.x},${q.y}`).join(' '));el.setAttribute('fill','none');el.setAttribute('stroke',p===target?'#16a05d':selected.includes(p)?'#1677ff':'#e44');el.setAttribute('stroke-width',p===target?'2':'1');el.setAttribute('opacity',selected.includes(p)?'.9':'.35');svg.appendChild(el)}preview.innerHTML=selected.length?selected.map((p,i)=>{const cp=knots(p.filter(q=>inRect(q,selection))).length;return `<div class="${i===0?'export-target':''}">曲線 ${i+1}: CP ${cp}個${i===0?'（書き出し対象）':''}</div>`}).join(''):'矩形選択すると、曲線ごとのCP数を表示します。';if(target){const points=target.filter(q=>inRect(q,selection));const step=Math.max(1,Math.floor(points.length/24));for(let i=0;i<points.length;i+=step){const c=document.createElementNS('http://www.w3.org/2000/svg','circle');c.classList.add('cp-marker');c.setAttribute('cx',points[i].x);c.setAttribute('cy',points[i].y);c.setAttribute('r','3');c.setAttribute('fill','#16a05d');c.setAttribute('stroke','#fff');svg.appendChild(c)}}if(selection){const r=document.createElementNS('http://www.w3.org/2000/svg','rect');r.setAttribute('x',selection.x);r.setAttribute('y',selection.y);r.setAttribute('width',selection.w);r.setAttribute('height',selection.h);r.setAttribute('fill','none');r.setAttribute('stroke','#1677ff');r.setAttribute('stroke-width','2');r.id='selection';svg.appendChild(r)}}
function inRect(p,r){return p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h}
async function renderPage(){if(!sourceFile)return;const form=new FormData();form.append('file',sourceFile);const n=Math.max(1,Number(pageInput.value)||1);const response=await fetch(`/convert-pdf?page=${n}`,{method:'POST',body:form});if(!response.ok)throw Error(await response.text());stage.innerHTML=await response.text();svg=stage.querySelector('svg');if(!svg)throw Error('SVGページを作成できませんでした');paths=[];pathElements=[];for(const element of svg.querySelectorAll('path')){const path=parsePath(element.getAttribute('d')||'');if(path.length>1){paths.push(path);pathElements.push(element)}}selection=null;exportButton.disabled=!paths.length;drawPaths();setStatus(`${paths.length}本の線を読み込みました。矩形で選択してください。`)}
file.onchange=()=>{sourceFile=file.files[0];renderButton.disabled=!sourceFile;if(sourceFile)renderPage().catch(e=>setStatus(`PDFを表示できませんでした: ${e.message}`))};renderButton.onclick=()=>renderPage().catch(e=>setStatus(`PDFを表示できませんでした: ${e.message}`));
function svgPoint(e){const r=svg.getBoundingClientRect(),vb=svg.viewBox.baseVal;return{x:(e.clientX-r.left)*(vb.width/r.width),y:(e.clientY-r.top)*(vb.height/r.height)}}
stage.addEventListener('pointerdown',e=>{if(!svg)return;const point=svgPoint(e);if(selectMode.value==='curve'){const nearest=paths.map((p,index)=>({p,index,d:Math.min(...p.map(q=>Math.hypot(q.x-point.x,q.y-point.y)))})).sort((a,b)=>a.d-b.d)[0];if(!nearest||nearest.d>12){setStatus('曲線上をクリックしてください。');return}const xs=nearest.p.map(q=>q.x),ys=nearest.p.map(q=>q.y);selection={x:Math.min(...xs),y:Math.min(...ys),w:Math.max(...xs)-Math.min(...xs),h:Math.max(...ys)-Math.min(...ys)};drawPaths();setStatus(`曲線 ${nearest.index+1} を選択しました`);return}start=point;dragging=true;stage.setPointerCapture(e.pointerId)});stage.addEventListener('pointermove',e=>{if(!dragging)return;const point=svgPoint(e);selection={x:Math.min(start.x,point.x),y:Math.min(start.y,point.y),w:Math.abs(point.x-start.x),h:Math.abs(point.y-start.y)};drawPaths()});stage.addEventListener('pointerup',()=>{dragging=false;if(selection){const n=paths.filter(p=>p.some(q=>inRect(q,selection))).length;setStatus(`選択範囲内の線: ${n}本`)}});
stage.addEventListener('click',e=>{if(selectMode.value!=='curve'||!svg)return;const hit=document.elementsFromPoint(e.clientX,e.clientY).find(el=>el.tagName?.toLowerCase()==='path'),index=hit?pathElements.indexOf(hit):-1;if(index<0)return;const p=paths[index],xs=p.map(q=>q.x),ys=p.map(q=>q.y);selection={x:Math.min(...xs),y:Math.min(...ys),w:Math.max(...xs)-Math.min(...xs),h:Math.max(...ys)-Math.min(...ys)};drawPaths();setStatus(`曲線 ${index+1} を選択しました`)});
svg?.addEventListener('click',e=>{if(selectMode.value!=='curve')return;const hit=e.target.closest?.('path'),index=hit?pathElements.indexOf(hit):-1;if(index<0)return;const p=paths[index],xs=p.map(q=>q.x),ys=p.map(q=>q.y);selection={x:Math.min(...xs),y:Math.min(...ys),w:Math.max(...xs)-Math.min(...xs),h:Math.max(...ys)-Math.min(...ys)};drawPaths();setStatus(`曲線 ${index+1} を選択しました`)});
function knots(points){const minX=Math.min(...points.map(p=>p.x)),maxX=Math.max(...points.map(p=>p.x)),midY=(Math.min(...points.map(p=>p.y))+Math.max(...points.map(p=>p.y)))/2,f=(Number($('length').value)||244)/(maxX-minX||1)*Number($('scale').value||1),ox=Number($('offsetX').value)||0,oy=Number($('offsetY').value)||0;return points.sort((a,b)=>a.x-b.x).map((p,i,a)=>{const x=(p.x-minX)*f+ox,y=(p.y-midY)*f+oy,prev=a[i-1]||p,next=a[i+1]||p;return [x,y,x+(prev.x-p.x)*f/3,y+(prev.y-p.y)*f/3,x+(next.x-p.x)*f/3,y+(next.y-p.y)*f/3]})}
function block(id,ks){return `(${id}\n${ks.map(k=>`(cp [${k.map(v=>Number(v.toFixed(5))).join(',')}] true false)`).join('\n')}\n)`}exportButton.onclick=()=>{if(!selection)return;const p=paths.filter(a=>a.some(q=>inRect(q,selection))).sort((a,b)=>b.length-a.length)[0];if(!p)return;const ks=knots(p.filter(q=>inRect(q,selection)));if(ks.length<2){setStatus('選択範囲を広げてください。');return}const kind=$('kind').value,body=kind==='outline'?block(32,ks):block(33,ks),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([body+'\n'],{type:'text/plain'}));a.download=kind==='outline'?'pdf-outline.otl':'pdf-profile.pfl';a.click();setStatus(`${ks.length}個のCPを書き出しました。`)};
stage.addEventListener('click',e=>{if(selectMode.value!=='curve'||!svg)return;const hit=document.elementsFromPoint(e.clientX,e.clientY).find(el=>el.classList?.contains('import-path'));if(!hit){selection=null;drawPaths();setStatus('選択を解除しました。');return}const index=[...svg.querySelectorAll('.import-path')].indexOf(hit);if(index<0)return;const p=paths[index],xs=p.map(q=>q.x),ys=p.map(q=>q.y);selection={x:Math.min(...xs),y:Math.min(...ys),w:Math.max(...xs)-Math.min(...xs),h:Math.max(...ys)-Math.min(...ys)};drawPaths();setStatus(`曲線 ${index+1} を選択しました`)});
stage.addEventListener('pointerup',e=>{if(selectMode.value!=='curve'||!svg)return;const point=svgPoint(e), candidates=paths.map((p,index)=>{const source=pathElements[index];if(!source||!(source.getAttribute('fill')==='none'||source.hasAttribute('stroke')))return null;const m=source.getCTM?.();let d=Infinity;for(const q of p){const x=m?m.a*q.x+m.c*q.y+m.e:q.x,y=m?m.b*q.x+m.d*q.y+m.f:q.y;d=Math.min(d,Math.hypot(x-point.x,y-point.y))}return{p,index,d}}).filter(Boolean).sort((a,b)=>a.d-b.d),nearest=candidates[0];if(!nearest||nearest.d>80)return;const xs=nearest.p.map(q=>q.x),ys=nearest.p.map(q=>q.y);selection={x:Math.min(...xs),y:Math.min(...ys),w:Math.max(...xs)-Math.min(...xs),h:Math.max(...ys)-Math.min(...ys)};drawPaths();setStatus(`曲線 ${nearest.index+1} を選択しました`) });
const compoundPathSplitter=new MutationObserver(()=>{if(!svg||svg.dataset.compoundSplit)return;let changed=false;for(const original of [...svg.querySelectorAll('path')]){const d=original.getAttribute('d')||'',parts=d.match(/[Mm][^Mm]*/g)||[];if(parts.length<2)continue;for(const part of parts){const clone=original.cloneNode(true);clone.setAttribute('d',part.trim());original.parentNode.insertBefore(clone,original)}original.remove();changed=true}svg.dataset.compoundSplit='1';if(changed){paths=[];pathElements=[];for(const element of svg.querySelectorAll('path')){const path=parsePath(element.getAttribute('d')||'');if(path.length>1){paths.push(path);pathElements.push(element)}}drawPaths()}});compoundPathSplitter.observe(stage,{childList:true,subtree:true});
</script></body></html>
